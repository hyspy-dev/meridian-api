name: publish

# meridian-api is the SDK library consumed by meridian-protocol, the proxy/core, and modules,
# so it publishes to GitHub Packages (a Maven dependency), not to a Release.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
          server-id: github            # matches <distributionManagement><id> in the pom
          settings-path: ${{ github.workspace }}

      - name: Deploy to GitHub Packages
        run: mvn -B -ntp -DskipTests deploy -s "$GITHUB_WORKSPACE/settings.xml"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
